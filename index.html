<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình DET 120</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Bố cục: một cột 980px, header dính trên cùng, mỗi tab là một màn hình. */
:root{--bg:#f6f8fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--line2:#cbd5e1;--soft:#eef2ff;--done:#f8fafc;--hdr:rgba(246,248,251,.92);
--acc:#1e5eff;--acc2:#e8efff;--accline:#cddbff;--accink:#1e3a8a;--onacc:#fff;
--ok:#16a34a;--okbg:#e7f6ec;--warn:#b45309;--warnbg:#fff4e0;--bad:#dc2626;--badbg:#fdecec;
--sang:#fff1e0;--sangt:#b45309;--ngay:#e6efff;--ngayt:#1e4fd6;--toi:#f1e8ff;--toit:#7e22ce;--cn:#e7f6ec;--cnt:#15803d;
--toastbg:#0f172a;--toastfg:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1220;--card:#151c2e;--ink:#e6eaf3;--mute:#94a0b8;--line:#253049;--line2:#3a4763;--soft:#1c2744;--done:#121828;--hdr:rgba(13,18,32,.9);
--acc:#6f97ff;--acc2:#1a2647;--accline:#2c3d6b;--accink:#c9d7ff;--onacc:#0d1220;
--ok:#4ade80;--okbg:#12291c;--warn:#fbbf24;--warnbg:#2c2210;--bad:#f87171;--badbg:#2e1517;
--sang:#2c2210;--sangt:#fbbf24;--ngay:#16213f;--ngayt:#93b4ff;--toi:#24183a;--toit:#d0a8ff;--cn:#12291c;--cnt:#6ee7a0;
--toastbg:#e6eaf3;--toastfg:#0d1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1220;--card:#151c2e;--ink:#e6eaf3;--mute:#94a0b8;--line:#253049;--line2:#3a4763;--soft:#1c2744;--done:#121828;--hdr:rgba(13,18,32,.9);
--acc:#6f97ff;--acc2:#1a2647;--accline:#2c3d6b;--accink:#c9d7ff;--onacc:#0d1220;
--ok:#4ade80;--okbg:#12291c;--warn:#fbbf24;--warnbg:#2c2210;--bad:#f87171;--badbg:#2e1517;
--sang:#2c2210;--sangt:#fbbf24;--ngay:#16213f;--ngayt:#93b4ff;--toi:#24183a;--toit:#d0a8ff;--cn:#12291c;--cnt:#6ee7a0;
--toastbg:#e6eaf3;--toastfg:#0d1220;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:980px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--acc)}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn)}.dot.local{background:var(--mute)}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:9px 12px;border-radius:10px 10px 0 0;color:var(--mute);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
nav a.on{color:var(--acc);border-bottom-color:var(--acc)}
.badge{font:600 11px "JetBrains Mono",monospace;background:var(--bad);color:var(--card);border-radius:99px;padding:1px 7px;line-height:1.5}
.badge:empty{display:none}
main{max-width:980px;margin:0 auto;padding:18px 16px 30px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .lab{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
h2{font-size:17px;margin:22px 0 10px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.dayhead h2{margin:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px Manrope,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--line2)}
.btn:focus-visible,.chip:focus-visible,.chk:focus-visible,nav a:focus-visible,.lnk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.navbtns{display:flex;gap:6px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;transition:background .2s}
.task.done{background:var(--done)}
.task.done .ttext{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line2)}
.chk{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--line2);border-radius:7px;cursor:pointer;margin-top:1px;display:grid;place-content:center;background:var(--card)}
.chk:checked{background:var(--acc);border-color:var(--acc)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--onacc);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tbody{flex:1;min-width:0}
.tmeta{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-Sáng{background:var(--sang);color:var(--sangt)}.p-Ban{background:var(--ngay);color:var(--ngayt)}.p-Tối{background:var(--toi);color:var(--toit)}.p-CN{background:var(--cn);color:var(--cnt)}
.p-type{background:var(--soft);color:var(--acc)}
.mins{font-size:12px;color:var(--mute)}
.ttext ul{margin:0;padding-left:18px}
.ttext li{margin:2px 0}
.lnk{color:var(--acc);font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.tag-mock{background:var(--warnbg);color:var(--warn)}
.note{background:var(--acc2);border:1px solid var(--accline);color:var(--accink);border-radius:12px;padding:12px 14px;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:30px}
.week{margin-bottom:10px}
.week summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
.week summary::-webkit-details-marker{display:none}
.wk{font-weight:800;font-size:15px;min-width:34px;color:var(--acc)}
.wmid{flex:1;min-width:0}
.wmid b{font-weight:700}
.wmid div{font-size:13px;color:var(--mute)}
.wpct{font-weight:700;font-size:14px;min-width:46px;text-align:right}
.week[open] summary{margin-bottom:12px}
.drow{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.drow>div{min-width:0}
.drow .dd{font-size:13px;font-weight:700}
.drow .dd small{display:block;color:var(--mute);font-weight:500}
.drow.today .dd{color:var(--acc)}
.mini{display:flex;gap:8px;align-items:flex-start;margin:3px 0;font-size:13.5px}
.mini .chk{width:19px;height:19px;border-radius:6px}
.mini .chk:checked::after{width:5px;height:9px}
.mini.done>span{color:var(--mute);text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap{overflow-x:auto}
input.num{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:600 14px "JetBrains Mono",monospace;background:var(--card);color:var(--ink)}
input.num:focus,input.txt:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
input.txt,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font:500 14px Manrope,sans-serif;background:var(--card);color:var(--ink)}
textarea{resize:vertical;min-height:44px}
label.f{font-size:12px;font-weight:700;color:var(--mute);display:block;margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font:600 13px Manrope,sans-serif;cursor:pointer;color:var(--mute)}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.chip b{font-family:"JetBrains Mono",monospace;font-weight:600;margin-left:4px}
.method{margin-bottom:10px}
.method .prob{display:inline-block;font-size:12px;font-weight:700;background:var(--badbg);color:var(--bad);border-radius:99px;padding:2px 9px;margin-bottom:8px}
.method .row{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14px;padding:6px 0;border-top:1px dashed var(--line)}
.method .row b{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
@media(max-width:560px){.method .row{grid-template-columns:1fr;gap:2px}}
.cp{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.cp .when{font-weight:800;color:var(--acc)}
.cp .ok{color:var(--ok)}.cp .no{color:var(--warn)}
.chart{width:100%;height:auto}
.chart .grid-l{stroke:var(--line)}.chart .goal{stroke:var(--acc);stroke-dasharray:4 4}
.chart .axis{fill:var(--mute);font:11px "JetBrains Mono",monospace}
.chart .val{fill:var(--ink);font:700 12px "JetBrains Mono",monospace}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round}.chart .pt{fill:var(--acc)}
.muted{color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.row2{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toastbg);color:var(--toastfg);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.phase{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.foot{max-width:980px;margin:0 auto;padding:0 16px 40px;font-size:13px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.foot .sp{flex:1}

/* ---------- Sổ lỗi ---------- */
.rv-hero{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rv-hero .big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.rv-hero .sub{font-size:13px;color:var(--mute);margin-top:4px}
.rv-hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin:12px 0 6px}
.seg i{display:block;height:100%}
.seg .s-new{background:var(--line2)}.seg .s-learning{background:var(--acc)}.seg .s-done{background:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px;background:var(--c)}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;padding:6px 10px 8px;font:700 13.5px Manrope,sans-serif;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form>*{min-width:0}
select{max-width:100%}
@media(max-width:620px){.form{grid-template-columns:1fr}}
.formfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--mute)}
.filters{display:grid;gap:8px;margin-bottom:10px}
.filters .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .top input{flex:1;min-width:180px}
.err{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:4px}
.err:first-child{border-top:0;padding-top:0}
.err .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ln-w,.ln-r{display:grid;grid-template-columns:16px 1fr;gap:4px;overflow-wrap:anywhere}
.ln-w::before{content:"✗";color:var(--bad);font-weight:800}
.ln-r::before{content:"✓";color:var(--ok);font-weight:800}
del{background:var(--badbg);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px;border-radius:4px;padding:0 2px}
ins{background:var(--okbg);color:var(--ok);text-decoration:none;font-weight:700;border-radius:4px;padding:0 2px}
.why{font-size:13.5px;color:var(--mute);padding-left:20px}
.why b{color:var(--ink);font-weight:700}
.err .ft{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;color:var(--mute);padding-left:20px}
.err .ft .acts{display:flex;gap:12px}
.boxes{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.boxes i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.boxes i.on{background:var(--acc)}.boxes.full i{background:var(--ok)}
.tlink{border:none;background:none;padding:0;font:600 12.5px Manrope,sans-serif;color:var(--mute);cursor:pointer}
.tlink:hover{color:var(--acc)}
.tlink.dng{color:var(--bad)}
.err.editing{background:var(--done);margin:0 -16px;padding:12px 16px}

/* ---------- Phiên ôn ---------- */
.rv{max-width:680px;margin:0 auto}
.rv-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rv-top .bar{flex:1;margin:0}
.rv-card{padding:22px}
.rv-q{font-size:12.5px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.rv-p{font-size:20px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.rv-ans{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:8px;font-size:17px}
.rv-ans .why{padding-left:20px;font-size:14px}
.typed{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--done);border:1px solid var(--line)}
.typed.good{background:var(--okbg);border-color:transparent;color:var(--ok);font-weight:700}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.grades .btn{flex-direction:column;gap:0;padding:10px 6px;line-height:1.25}
.grades .btn small{font-weight:500;font-size:12px;color:var(--mute)}
.g-again{border-color:var(--bad)!important;color:var(--bad)!important}
.g-hard{border-color:var(--warn)!important;color:var(--warn)!important}
.g-good{background:var(--okbg)!important;border-color:var(--ok)!important;color:var(--ok)!important}
.g-good.sug{outline:2px solid var(--ok);outline-offset:2px}
kbd{font:600 11px "JetBrains Mono",monospace;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--mute)}
.keys{font-size:12px;color:var(--mute);text-align:center;margin-top:12px}
@media(max-width:560px){.keys{display:none}.rv-p{font-size:18px}}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.sumgrid div{border-radius:12px;padding:12px;text-align:center;font-size:13px;font-weight:600}
.sumgrid b{display:block;font:800 24px "JetBrains Mono",monospace}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand"><h1>Lộ trình <span>DET 120</span></h1><div class="sync"><span class="dot" id="dot"></span><span id="synctxt">Đang tải…</span></div></div>
  <nav id="nav">
    <a href="#today" data-v="today">Hôm nay</a>
    <a href="#plan" data-v="plan">Lộ trình 9 tuần</a>
    <a href="#scores" data-v="scores">Thi thử & mốc</a>
    <a href="#errors" data-v="errors">Sổ lỗi <span class="badge" id="navDue"></span></a>
    <a href="#methods" data-v="methods">Phương pháp</a>
  </nav>
</div></header>
<main id="app"></main>
<div class="foot">
  <span>Dữ liệu lưu trong trình duyệt này. Nên tải bản sao lưu mỗi tuần.</span><span class="sp"></span>
  <button class="btn sm" id="btnExport" type="button">Tải bản sao lưu</button>
  <button class="btn sm" id="btnImport" type="button">Nhập bản sao lưu</button>
  <input type="file" id="impFile" accept="application/json,.json" hidden>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
   1. DỮ LIỆU CỐ ĐỊNH (không lưu, sửa trực tiếp ở đây)
   ===================================================================== */

/* Mẫu nhiệm vụ: mã → [số phút, nội dung]. Các ý cách nhau bằng " · ".
   Tiền tố mã: s = Sáng, b = Ban ngày, t = Tối, c = Chủ nhật. */
const TASKS = {
  s1: [60, "Làm quen khung nói: 3 đề Photo + 2 đề Read, Then Speak, ghi âm 40' · Chép 10 lỗi hay mắc vào Sổ lỗi 20'"],
  s2: [100, "THI THỬ: Arno full test – làm như thi thật, không dừng 60' · Ghi điểm vào tab Thi thử, tìm 3 dạng mất điểm nhiều nhất → Sổ lỗi 40'"],
  s3: [120, "Speaking Sample + Listen, Then Speak 2 đề, kỹ thuật 4-3-2 60' · Writing Sample 1 bài 30' · Gemini chấm + Sổ lỗi 30'"],
  s4: [120, "Interactive Speaking 1 bộ (mỗi câu: Trả lời – Vì sao – Ví dụ) 40' · Interactive Listening (Listen and Respond + Summarize) 40' · Write About the Photo ×3 20' · Sổ lỗi 20'"],
  s5: [120, "Ôn khung nói 10' · Speak About the Photo + Read, Then Speak 3 đề (dàn ý 3 ô → nói → nghe lại → nói lại) 50' · Write About the Photo ×3 + Interactive Writing 1 bài 40' · Chữa → Sổ lỗi 20'"],
  s6: [100, "THI THỬ: DET Practice Test (chính thức, miễn phí) – làm như thi thật, không dừng 60' · Ghi điểm vào tab Thi thử, tìm 3 dạng mất điểm nhiều nhất → Sổ lỗi 40'"],
  s7: [120, "Speaking bấm giờ như thi: Photo ×3 + Read, Then Speak ×3 → nghe lại theo checklist 60' · Writing bấm giờ: Photo ×3 + Interactive Writing 40' · Chữa → Sổ lỗi 20'"],

     log:      { "ngày": {n: số câu đã ôn, ok: số câu nhớ chắc} }
   }
   ===================================================================== */
const LS_KEY="det120v2", LS_OLD="det120", LS_BAK="det120.bak-v1", LS_PREFS="det120.prefs";
function emptyState(){return {v:2,settings:{examDate:"2027-01-20"},plan:{done:{},notes:{}},mocks:{},errors:[],log:{}}}
let state=emptyState();

/* Đọc mọi dạng lỗi đã từng lưu: bản cũ {q,type,w,r}, bản thử {category,text,review}, bản mới. */
function normErr(e){
  e=e||{};const t=todayISO();
  const box=Math.max(0,Math.min(MAXBOX,Number(e.box??e.review?.stage??0)||0));
  const type=e.category?.error||(typeof e.type==="string"?e.type:"")||ERRTYPES[0];
  return {
    id:String(e.id||uid()),
    created:e.created||e.d||t,
    qtype:e.qtype||e.category?.task||e.q||QTYPES[0],
    type,
    wrong:String(e.wrong??e.text?.wrong??e.w??""),
    right:String(e.right??e.text?.right??e.r??""),
    note:String(e.note??""),
    box,
    due:e.due||e.review?.nextAt||e.d||t,
    last:e.last||e.review?.lastAt||"",
    reps:Number(e.reps)||(e.review?.lastAt?1:0),
    lapses:Number(e.lapses)||0
  };
}
function migrate(raw){
  const s=emptyState();
  if(!raw||typeof raw!=="object")return s;
  if(raw.v===2){
    s.settings.examDate=raw.settings?.examDate||s.settings.examDate;
    s.plan.done=raw.plan?.done||{};s.plan.notes=raw.plan?.notes||{};
    s.mocks=raw.mocks||{};s.log=raw.log||{};
  }else{
    s.settings.examDate=raw.examDate||s.settings.examDate;
    s.plan.done=raw.done||{};s.plan.notes=raw.weekNotes||{};
    s.mocks=raw.mocks||{};
  }
  s.errors=Array.isArray(raw.errors)?raw.errors.map(normErr):[];
  return s;
}
function mergeState(cur,inc){
  let added=0;
  for(const k in inc.plan.done)if(inc.plan.done[k])cur.plan.done[k]=true;
  for(const k in inc.plan.notes)if(!cur.plan.notes[k])cur.plan.notes[k]=inc.plan.notes[k];
  for(const id in inc.mocks){const c=cur.mocks[id]||(cur.mocks[id]={});for(const k in inc.mocks[id])if(c[k]===undefined||c[k]==="")c[k]=inc.mocks[id][k]}
  const byId=new Map(cur.errors.map(e=>[e.id,e]));
  for(const e of inc.errors){const c=byId.get(e.id);if(!c){cur.errors.push(e);added++}else if((e.last||"")>(c.last||"")||e.reps>c.reps)Object.assign(c,e)}
  for(const d in inc.log){const a=cur.log[d],b=inc.log[d];if(!a||b.n>a.n)cur.log[d]=b}
  return added;
}

/* --- lưu trên máy --- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

function localLoad(){

      migratedNote=`Đã chuyển dữ liệu cũ sang cấu trúc mới (${s.errors.length} lỗi, ${Object.keys(s.plan.done).length} buổi đã xong). Bản cũ vẫn được giữ.`;
      lsSet(LS_KEY,JSON.stringify(s));
      return s;
    }catch(e){}

}

/* --- đồng bộ đám mây (chỉ khi mở trong claude.ai) --- */
let db=null, docRef=null, saving=false, dirty=false, saveTimer=null, lastLocalEdit=0;
function setSync(kind,txt){$("#dot").className="dot "+kind;$("#synctxt").textContent=txt}
function changed(){lastLocalEdit=Date.now();localSave();dirty=true;if(db&&docRef){setSync("busy","Đang lưu…");clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}}
async function flush(){
  if(!docRef||saving||!dirty)return;
  saving=true;dirty=false;
  try{await docRef.set(JSON.parse(JSON.stringify(state)));setSync("ok","Đã đồng bộ")}
  catch(e){
    if(e&&e.code==="unavailable"){dirty=true;setTimeout(flush,1500+Math.random()*1000)}
    else if(e&&e.code==="quota_exceeded"){setSync("local","Bộ nhớ đầy – chỉ lưu trên máy này")}
    else{setSync("local","Không lưu được lên mây – đang lưu trên máy này");docRef=null}
  }
  saving=false; if(dirty)flush();
}
async function init(){
  const local=localLoad(); if(local)state=local;
  render();
  if(migratedNote)setTimeout(()=>toast(migratedNote),300);
  if(!window.claude||!window.claude.use){setSync("local","Lưu trên trình duyệt này");return}
  let timer=setTimeout(()=>setSync("local","Chưa kết nối được – đang lưu trên máy này"),10000);
  try{
    db=await window.claude.use("db"); const user=await window.claude.use("user");
    const id=user?await user.id():null;
    if(!db||!id){clearTimeout(timer);setSync("local","Lưu trên máy này (đăng nhập để đồng bộ)");db=null;return}
    docRef=db.doc("data/users/"+id+"/progress");
    docRef.onSnapshot(snap=>{
      if(!snap.metadata.fromCache)clearTimeout(timer);
      if(snap.metadata.hasPendingWrites)return;
      if(snap.exists){
        if(Date.now()-lastLocalEdit<3000||dirty||saving)return;
        const raw=JSON.parse(JSON.stringify(snap.data()));
        state=migrate(raw);localSave();render();
        if(raw.v!==2){dirty=true;flush()}
        setSync("ok","Đã đồng bộ");
      }else if(!snap.metadata.fromCache){dirty=true;flush();setSync("ok","Đã đồng bộ")}
    },err=>{clearTimeout(timer);setSync("local","Mất kết nối – đang lưu trên máy này");docRef=null});
  }catch(e){clearTimeout(timer);setSync("local","Lưu trên máy này")}
}

const isDone=r=>!!state.plan.done[tid(r)];
function pctOf(rows){if(!rows.length)return 0;return rows.filter(isDone).length/rows.length}
function minsOf(rows,onlyDone){return rows.reduce((a,r)=>a+((!onlyDone||isDone(r))?r.m:0),0)}
function weekOf(s){let w=WEEKS[0];for(const x of WEEKS)if(s>=x.start)w=x;return w}
function streak(){
  let d=todayISO(),n=0;
  if(!PLAN.some(r=>r.d===d&&isDone(r)))d=addDays(d,-1);
  while(d>=PLAN[0].d){
    const rows=PLAN.filter(r=>r.d===d);
    if(!rows.length){d=addDays(d,-1);continue}
    if(rows.some(isDone)){n++;d=addDays(d,-1)}else break;
  }
  return n;
}
function latestMock(){
  let last=null;
  for(const m of MOCKS){const v=state.mocks[m.id];if(v&&v.o!==undefined&&v.o!==""&&v.o!==null)last={...m,o:Number(v.o)}}
  return last;
}

const STATUS={new:"Mới",learning:"Đang nhớ",done:"Đã thuộc"};
const errStatus=e=>e.box>=MAXBOX?"done":(e.reps?"learning":"new");
function dueErrors(){const t=todayISO();return state.errors.filter(e=>e.due<=t).sort((a,b)=>a.due.localeCompare(b.due)||a.box-b.box||a.created.localeCompare(b.created))}
const logToday=()=>state.log[todayISO()]||{n:0,ok:0};
function plan4Today(){const due=dueErrors().length;const left=Math.max(0,DAILY-logToday().n);return {due,left,goal:Math.min(due,left)}}
function nextDueDate(){const t=todayISO();let m=null;for(const e of state.errors)if(e.due>t&&(!m||e.due<m))m=e.due;return m}
function schedule(e,g){
  if(g==="again")return {box:0,days:1};
  if(g==="hard")return {box:e.box,days:Math.max(1,Math.floor(INTV[e.box]/2))};
  const box=Math.min(MAXBOX,e.box+1);return {box,days:INTV[box]};
}
const dayLabel=n=>n<=1?"mai":`${n} ngày`;

/* So sánh từng từ (LCS) để tô chỗ sai/chỗ sửa. */
function wordDiff(a,b){
  const A=a.trim().split(/\s+/).filter(Boolean).slice(0,120),B=b.trim().split(/\s+/).filter(Boolean).slice(0,120);
  const key=w=>w.toLowerCase().replace(/[.,!?;:"“”()]/g,"");
  const n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=key(A[i])===key(B[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ka=new Array(n).fill(false),kb=new Array(m).fill(false);
  let i=0,j=0;while(i<n&&j<m){if(key(A[i])===key(B[j])){ka[i]=kb[j]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  const wrap=(arr,keep,tag)=>{let out=[],run=[];const fl=()=>{if(run.length){out.push(`<${tag}>${esc(run.join(" "))}</${tag}>`);run=[]}};
    arr.forEach((w,k)=>{if(keep[k]){fl();out.push(esc(w))}else run.push(w)});fl();return out.join(" ")};
  const mg=[];i=0;j=0;
  while(i<n||j<m){
    if(i<n&&j<m&&key(A[i])===key(B[j])){mg.push(esc(B[j]));i++;j++}
    else if(j>=m||(i<n&&L[i+1][j]>=L[i][j+1])){mg.push(`<del>${esc(A[i])}</del>`);i++}
    else{mg.push(`<ins>${esc(B[j])}</ins>`);j++}
  }
  return {a:wrap(A,ka,"del"),b:wrap(B,kb,"ins"),m:mg.join(" "),same:L[0][0]===n&&n===m};
}
const normTxt=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[^\p{L}\p{N}' ]+/gu," ").replace(/\s+/g," ").trim();
function pairHTML(e){
  if(e.wrong&&e.right){const d=wordDiff(e.wrong,e.right);return `<div class="ln-w"><span>${d.a||"&nbsp;"}</span></div><div class="ln-r"><span>${d.b||"&nbsp;"}</span></div>`}
  return (e.wrong?`<div class="ln-w"><span>${esc(e.wrong)}</span></div>`:"")+(e.right?`<div class="ln-r"><span>${esc(e.right)}</span></div>`:"");
}

function chartSVG(){
  const data=MOCKS.map(m=>({m,v:state.mocks[m.id]})).filter(x=>x.v&&x.v.o!==""&&x.v.o!=null&&!isNaN(Number(x.v.o)));

  const W=600,H=200,pl=36,pr=14,pt=20,pb=28;
  const ys=data.map(x=>Number(x.v.o));const lo=Math.min(90,...ys)-5,hi=Math.max(130,...ys)+5;
  const X=i=>pl+(data.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(data.length-1));const Y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let g="";for(const v of [100,110,120,130]){if(v<lo||v>hi)continue;g+=`<line class="${v===120?"goal":"grid-l"}" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Điểm overall các lần thi thử">${g}<path class="ln" d="${path}"/>${dots}</svg>`;
}

function typeChips(sel,attr){return ERRTYPES.map(t=>`<button type="button" class="chip ${sel===t?"on":""}" ${attr}="${esc(t)}">${esc(t)}</button>`).join("")}
function qtypeOptions(sel){return QTYPES.map(q=>`<option value="${esc(q)}" ${q===sel?"selected":""}>${esc(q)}</option>`).join("")}
function parseBulk(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/\s*(?:=>|->|→|\t)\s*/);
    return {wrong:p[0]||"",right:p[1]||"",note:p.slice(2).join(" · ")};
  }).filter(x=>x.wrong||x.right);
}

function filteredErrors(){
  const t=todayISO(),q=normTxt(ef.q);
  return state.errors.filter(e=>{
    if(ef.type!=="all"&&e.type!==ef.type)return false;
    if(ef.status==="due"&&e.due>t)return false;
    if(ef.status!=="all"&&ef.status!=="due"&&errStatus(e)!==ef.status)return false;
    if(q&&!normTxt(e.wrong+" "+e.right+" "+e.note+" "+e.qtype).includes(q))return false;
    return true;
  }).sort((a,b)=>b.created.localeCompare(a.created)||(b.id>a.id?1:-1));

function errListHTML(){

/* ---------- Phiên ôn ---------- */
function newSession(ids,label){return {ids:[...ids],i:0,revealed:false,typed:"",seen:new Set(),requeued:new Set(),res:{again:0,hard:0,good:0},missed:[],label}}
function buildSession(kind){
  const due=dueErrors();
  if(kind==="type"){const l=state.errors.filter(e=>e.type===ef.type).sort((a,b)=>a.box-b.box||a.due.localeCompare(b.due));return newSession(l.map(e=>e.id),"Ôn riêng: "+ef.type)}
  if(kind==="extra"){const p=plan4Today();const pool=due.length?due:state.errors.slice().sort((a,b)=>a.due.localeCompare(b.due));return newSession(pool.slice(0,10).map(e=>e.id),"Ôn thêm")}
  const p=plan4Today();return newSession(due.slice(0,p.goal||Math.min(10,due.length)).map(e=>e.id),"Ôn hôm nay");
}
function currentCard(){
  while(session&&session.i<session.ids.length){const e=state.errors.find(x=>x.id===session.ids[session.i]);if(e)return e;session.i++}
  return null;
}
function vReview(){
  if(!session)session=buildSession("due");
  const total=session.ids.length;
  if(!total)return `<div class="rv"><div class="card empty"><b>Không có câu nào cần ôn.</b><br>${state.errors.length?"Bạn đã ôn hết phần đến hạn.":"Sổ lỗi đang trống."}<div style="margin-top:12px"><a class="btn" href="#errors" data-endrev>Về Sổ lỗi</a></div></div></div>`;
  const e=currentCard();
  if(!e)return vSummary();
  const pos=Math.min(session.i+1,total);
  const hasW=!!e.wrong;
  const ask=hasW?"Câu này sai ở đâu? Tự sửa lại:":"Nhớ lại câu đúng:";
  const prompt=hasW?esc(e.wrong):(e.note?esc(e.note):`<span class="muted">(${esc(e.type)} · ${esc(e.qtype)})</span>`);
  let ans="";
  if(session.revealed){
    let typed="";
    if(session.typed.trim()&&e.right){
      const ok=normTxt(session.typed)===normTxt(e.right);
      typed=ok?`<div class="typed good">✓ Bạn gõ đúng</div>`:`<div class="typed"><span class="muted">Bạn gõ:</span> ${wordDiff(session.typed,e.right).m} <span class="muted">(đỏ: thừa/sai · xanh: còn thiếu)</span></div>`;
      session.suggest=ok?"good":"";
    }else session.suggest="";
    ans=`<div class="rv-ans">${typed}${pairHTML(e)}${e.note&&hasW?`<div class="why"><b>Vì sao:</b> ${esc(e.note)}</div>`:""}</div>
    <div class="grades">${["again","hard","good"].map((g,k)=>{const s=schedule(e,g);const lab={again:"Quên",hard:"Mang máng",good:"Nhớ chắc"}[g];return `<button class="btn g-${g} ${session.suggest===g?"sug":""}" data-grade="${g}">${lab}<small>${g==="again"?"gặp lại mai":"ôn lại sau "+dayLabel(s.days)}</small></button>`}).join("")}</div>`;
  }
  return `<div class="rv">
   <div class="rv-top"><a class="btn sm" href="#errors" data-endrev aria-label="Dừng ôn">✕</a><div class="bar"><i style="width:${(session.i)/total*100}%"></i></div><span class="mono mins">${pos}/${total}</span></div>
   <div class="card rv-card">
    <div class="tmeta"><span class="pill p-type">${esc(e.type)}</span><span class="mins">${esc(e.qtype)}</span><span class="mins">${boxesHTML(e)}</span></div>
    <div class="rv-q">${ask}</div><div class="rv-p">${prompt}</div>
    ${e.right&&!session.revealed?`<div style="margin-top:14px"><label class="f" for="rvIn">Gõ câu đúng (không bắt buộc)</label><input class="txt" id="rvIn" value="${esc(session.typed)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ rồi Enter, hoặc bấm Xem đáp án"></div>`:""}
    ${session.revealed?ans:`<div style="margin-top:14px"><button class="btn pri" data-reveal style="width:100%">Xem đáp án</button></div>`}
   </div>
   <div class="keys">${session.revealed?"<kbd>1</kbd> Quên · <kbd>2</kbd> Mang máng · <kbd>3</kbd> Nhớ chắc":"<kbd>Enter</kbd> xem đáp án"} · <kbd>Esc</kbd> dừng</div>
  </div>`;
}
function vSummary(){
  const r=session.res,p=plan4Today();
  const missed=session.missed.map(id=>state.errors.find(e=>e.id===id)).filter(Boolean);
  return `<div class="rv"><div class="card rv-card">
   <h2 style="margin:0">Xong phiên ôn</h2><div class="muted" style="font-size:14px">${esc(session.label)} · ${session.seen.size} câu</div>
   <div class="sumgrid"><div style="background:var(--okbg);color:var(--ok)"><b>${r.good}</b>Nhớ chắc</div><div style="background:var(--warnbg);color:var(--warn)"><b>${r.hard}</b>Mang máng</div><div style="background:var(--badbg);color:var(--bad)"><b>${r.again}</b>Quên</div></div>
   ${missed.length?`<div class="hint" style="margin-bottom:6px">Đọc lại một lượt các câu vừa quên (mai sẽ gặp lại):</div><div style="display:grid;gap:10px;margin-bottom:12px">${missed.map(e=>`<div>${pairHTML(e)}${e.note?`<div class="why">${esc(e.note)}</div>`:""}</div>`).join("")}</div>`:""}
   <div style="display:flex;gap:8px;flex-wrap:wrap">${p.goal>0?`<button class="btn pri" data-start="due">Ôn tiếp ${p.goal} câu</button>`:""}<a class="btn" href="#errors" data-endrev>Về Sổ lỗi</a><a class="btn" href="#today" data-endrev>Về Hôm nay</a></div>
  </div></div>`;
}
function grade(g){
  const e=currentCard();if(!e)return;
  const t=todayISO(),s=schedule(e,g);
  const first=!session.seen.has(e.id);
  e.box=s.box;e.due=addDays(t,s.days);e.last=t;e.reps++;
  if(g==="again"){e.lapses++;if(!session.requeued.has(e.id)){session.requeued.add(e.id);session.ids.push(e.id)}if(!session.missed.includes(e.id))session.missed.push(e.id)}
  if(first){session.seen.add(e.id);session.res[g]++;const l=state.log[t]||(state.log[t]={n:0,ok:0});l.n++;if(g==="good")l.ok++}
  session.i++;session.revealed=false;session.typed="";
  changed();render();
  const inp=$("#rvIn");if(inp)inp.focus();
}
function reveal(){if(!session||session.revealed)return;const inp=$("#rvIn");if(inp)session.typed=inp.value;session.revealed=true;render();if(document.activeElement)document.activeElement.blur()}

const VIEWS={today:vToday,plan:vPlan,scores:vScores,errors:vErrors,methods:vMethods,review:vReview};

}

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches(".chk[data-id]")){if(t.checked)state.plan.done[t.dataset.id]=true;else delete state.plan.done[t.dataset.id];changed();render();if(t.checked)toast("Xong! 👍")}
  else if(t.id==="examDate"&&t.value){state.settings.examDate=t.value;changed();render()}
  else if(t.id==="fQtype"){prefs.qtype=t.value;savePrefs()}
  else if(t.id==="errType"){ef.type=t.value;ef.limit=40;render()}
  else if(t.id==="edQtype"&&editDraft){editDraft.qtype=t.value}
  else if(t.id==="impFile"&&t.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{try{const inc=migrate(JSON.parse(rd.result));const n=mergeState(state,inc);changed();render();toast(`Đã gộp bản sao lưu: thêm ${n} lỗi mới`)}catch(err){toast("File không đúng định dạng sao lưu của trang này")}t.value=""};
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.mock){const m=state.mocks[t.dataset.mock]||(state.mocks[t.dataset.mock]={});const v=t.value.replace(/[^0-9]/g,"");if(v!==t.value)t.value=v;if(v==="")delete m[t.dataset.k];else m[t.dataset.k]=Number(v);changed()}
  else if(t.dataset.wnote){state.plan.notes[t.dataset.wnote]=t.value;changed()}
  else if(t.id==="fWrong")draft.wrong=t.value;
  else if(t.id==="fRight")draft.right=t.value;
  else if(t.id==="fNote")draft.note=t.value;
  else if(t.id==="fBulk"){draft.bulk=t.value;const c=$("#bulkCount");if(c)c.innerHTML=bulkCountText()}
  else if(t.id==="errQ"){ef.q=t.value;ef.limit=40;renderErrList()}
  else if(t.id==="rvIn"&&session)session.typed=t.value;
  else if(editDraft&&t.id==="edWrong")editDraft.wrong=t.value;
  else if(editDraft&&t.id==="edRight")editDraft.right=t.value;
  else if(editDraft&&t.id==="edNote")editDraft.note=t.value;
});
document.addEventListener("focusout",e=>{if(e.target.dataset&&e.target.dataset.mock&&current()==="scores"){setTimeout(()=>{if(!document.activeElement||!document.activeElement.dataset.mock)render()},50)}});
document.addEventListener("click",e=>{
  const c=k=>e.target.closest(k);let n;

  if(n=c("[data-start]")){e.preventDefault();session=buildSession(n.dataset.start);if(current()!=="review")location.hash="review";else{window.scrollTo(0,0);render()}return}
  if(c("[data-reveal]")){reveal();return}
  if(n=c("[data-grade]")){grade(n.dataset.grade);return}
  if(c("[data-endrev]")){session=null;return}
  if(n=c("[data-fmode]")){draft.mode=n.dataset.fmode;render();const f=$(draft.mode==="one"?"#fWrong":"#fBulk");if(f)f.focus();return}
  if(n=c("[data-ftype]")){prefs.type=n.dataset.ftype;savePrefs();n.parentElement.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===n));return}
  if(n=c("[data-edtype]")){editDraft.type=n.dataset.edtype;n.parentElement.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===n));return}
  if(n=c("[data-est]")){ef.status=n.dataset.est;ef.limit=40;render();return}
  if(n=c("[data-ety]")){ef.type=ef.type===n.dataset.ety?"all":n.dataset.ety;ef.limit=40;render();$("#errQ")?.scrollIntoView({block:"center"});return}
  if(c("[data-more]")){ef.limit+=40;renderErrList();return}
  if(n=c("[data-edit]")){const x=state.errors.find(z=>z.id===n.dataset.edit);if(!x)return;editId=x.id;editDraft={wrong:x.wrong,right:x.right,note:x.note,type:x.type,qtype:x.qtype};renderErrList();$("#edWrong")?.focus();return}
  if(c("[data-edcancel]")){editId=null;editDraft=null;renderErrList();return}
  if(n=c("[data-edsave]")){const x=state.errors.find(z=>z.id===n.dataset.edsave);if(x&&editDraft){Object.assign(x,{wrong:editDraft.wrong.trim(),right:editDraft.right.trim(),note:editDraft.note.trim(),type:editDraft.type,qtype:editDraft.qtype});changed()}editId=null;editDraft=null;render();toast("Đã lưu thay đổi");return}
  if(n=c("[data-edreset]")){const x=state.errors.find(z=>z.id===n.dataset.edreset);if(x){x.box=0;x.due=todayISO();changed()}editId=null;editDraft=null;render();toast("Câu này sẽ được ôn lại từ hôm nay");return}
  if(n=c("[data-del]")){const id=n.dataset.del;clearTimeout(pendingDelTimer);
    if(pendingDel===id){state.errors=state.errors.filter(x=>x.id!==id);pendingDel=null;changed();render();toast("Đã xoá");return}
    pendingDel=id;renderErrList();pendingDelTimer=setTimeout(()=>{pendingDel=null;renderErrList()},3500);return}
  if(c("#btnExport")){
    const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`det120-sao-luu-${todayISO()}.json`;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Đã tạo file sao lưu");return}
  if(c("#btnImport")){$("#impFile").click();return}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="errForm")return;e.preventDefault();
  const t=todayISO();
  const mk=x=>({id:uid(),created:t,qtype:prefs.qtype,type:prefs.type,wrong:x.wrong.trim(),right:x.right.trim(),note:(x.note||"").trim(),box:0,due:addDays(t,1),last:"",reps:0,lapses:0});
  let items;
  if(draft.mode==="one"){if(!draft.wrong.trim()&&!draft.right.trim()){toast("Nhập câu sai hoặc câu đúng");$("#fWrong")?.focus();return}items=[mk(draft)];draft.wrong=draft.right=draft.note=""}
  else{const b=parseBulk(draft.bulk);if(!b.length){toast("Chưa có dòng nào hợp lệ");return}items=b.map(mk);draft.bulk=""}
  state.errors.push(...items);
  changed();render();toast(items.length>1?`Đã lưu ${items.length} lỗi · ôn từ ngày mai`:"Đã lưu lỗi · ôn từ ngày mai");
  $(draft.mode==="one"?"#fWrong":"#fBulk")?.focus();
});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t&&t.closest&&t.closest("#errForm")&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();$("#errForm").requestSubmit();return}
  if(current()!=="review"||!session)return;
  if(t&&t.id==="rvIn"){if(e.key==="Enter"){e.preventDefault();reveal()}else if(e.key==="Escape"){t.blur()}return}
  if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;
  if(e.key==="Escape"){session=null;location.hash="errors";return}
  if(!currentCard())return;
  if(!session.revealed&&(e.key==="Enter"||e.key===" ")){e.preventDefault();reveal();return}
  if(session.revealed){const g={"1":"again","2":"hard","3":"good"}[e.key];if(g){e.preventDefault();grade(g)}}
});
window.addEventListener("hashchange",()=>{if(current()!=="review")session=null;editId=null;editDraft=null;window.scrollTo(0,0);render();if(current()==="review")$("#rvIn")?.focus()});
init();
</script>
</body>
</html>
