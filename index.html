<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lộ trình DET 120</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--soft:#eef2ff;--acc:#1e5eff;--acc2:#e8efff;--ok:#16a34a;--okbg:#e7f6ec;--warn:#d97706;--warnbg:#fff4e0;--bad:#dc2626;--badbg:#fdecec;
--sang:#fff1e0;--sangt:#b45309;--ngay:#e6efff;--ngayt:#1e4fd6;--toi:#f1e8ff;--toit:#7e22ce;--cn:#e7f6ec;--cnt:#15803d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
header{position:sticky;top:0;z-index:10;background:rgba(246,248,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:980px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--acc)}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn)}.dot.local{background:#94a3b8}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:9px 12px;border-radius:10px 10px 0 0;color:var(--mute);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
nav a.on{color:var(--acc);border-bottom-color:var(--acc)}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .lab{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
h2{font-size:17px;margin:22px 0 10px;font-weight:800;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.dayhead h2{margin:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px Manrope,sans-serif;cursor:pointer}
.btn:hover{border-color:#cbd5e1}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.navbtns{display:flex;gap:6px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;transition:background .2s}
.task.done{background:#f8fafc}
.task.done .ttext{color:var(--mute);text-decoration:line-through;text-decoration-color:#cbd5e1}
.chk{appearance:none;flex:none;width:24px;height:24px;border:2px solid #cbd5e1;border-radius:7px;cursor:pointer;margin-top:1px;display:grid;place-content:center;background:#fff}
.chk:checked{background:var(--acc);border-color:var(--acc)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tbody{flex:1;min-width:0}
.tmeta{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.p-Sáng{background:var(--sang);color:var(--sangt)}.p-Ban{background:var(--ngay);color:var(--ngayt)}.p-Tối{background:var(--toi);color:var(--toit)}.p-CN{background:var(--cn);color:var(--cnt)}
.mins{font-size:12px;color:var(--mute)}
.ttext ul{margin:0;padding-left:18px}
.ttext li{margin:2px 0}
.tag-mock{background:var(--warnbg);color:var(--warn)}
.note{background:var(--acc2);border:1px solid #cddbff;color:#1e3a8a;border-radius:12px;padding:12px 14px;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:30px}
.week{margin-bottom:10px}
.week summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
.week summary::-webkit-details-marker{display:none}
.wk{font-weight:800;font-size:15px;min-width:34px;color:var(--acc)}
.wmid{flex:1;min-width:0}
.wmid b{font-weight:700}
.wmid div{font-size:13px;color:var(--mute)}
.wpct{font-weight:700;font-size:14px;min-width:46px;text-align:right}
.week[open] summary{margin-bottom:12px}
.drow{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.drow .dd{font-size:13px;font-weight:700}
.drow .dd small{display:block;color:var(--mute);font-weight:500}
.drow.today .dd{color:var(--acc)}
.mini{display:flex;gap:8px;align-items:flex-start;margin:3px 0;font-size:13.5px}
.mini .chk{width:19px;height:19px;border-radius:6px}
.mini .chk:checked::after{width:5px;height:9px}
.mini.done span{color:var(--mute);text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap{overflow-x:auto}
input.num{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:600 14px "JetBrains Mono",monospace;background:#fff}
input.num:focus,input.txt:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
input.txt,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font:500 14px Manrope,sans-serif;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
@media(max-width:620px){.form{grid-template-columns:1fr}}
label.f{font-size:12px;font-weight:700;color:var(--mute);display:block;margin-bottom:4px}
.err{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:4px}
.err .wrong{color:var(--bad)}
.err .right{color:var(--ok)}
.err .wrong::before{content:"✗ ";font-weight:700}
.err .right::before{content:"✓ ";font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font:600 13px Manrope,sans-serif;cursor:pointer;color:var(--mute)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip b{font-family:"JetBrains Mono",monospace;font-weight:600;margin-left:4px}
.method{margin-bottom:10px}
.method .prob{display:inline-block;font-size:12px;font-weight:700;background:var(--badbg);color:var(--bad);border-radius:99px;padding:2px 9px;margin-bottom:8px}
.method .row{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14px;padding:6px 0;border-top:1px dashed var(--line)}
.method .row b{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
@media(max-width:560px){.method .row{grid-template-columns:1fr;gap:2px}}
.cp{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.cp .when{font-weight:800;color:var(--acc)}
.cp .ok{color:var(--ok)}.cp .no{color:var(--warn)}
.chart{width:100%;height:auto}
.muted{color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.row2{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.del{border:none;background:none;color:var(--mute);cursor:pointer;font-size:13px;padding:0}
.del:hover{color:var(--bad)}
.phase{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
</style>
</head>

/* ---------- storage ---------- */
function setSync(kind,txt){$("#dot").className="dot "+kind;$("#synctxt").textContent=txt}
function localLoad(){try{const s=localStorage.getItem("det120");if(s)return JSON.parse(s)}catch(e){}return null}

function normalize(s){return Object.assign({done:{},mocks:{},errors:[],weekNotes:{},examDate:"2027-01-20"},s||{})}
function changed(){lastLocalEdit=Date.now();localSave();dirty=true;if(db&&docRef){setSync("busy","Đang lưu…");clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}}
async function flush(){
  if(!docRef||saving||!dirty)return;
  saving=true;dirty=false;
  try{await docRef.set(JSON.parse(JSON.stringify(state)));setSync("ok","Đã đồng bộ")}
  catch(e){
    if(e&&e.code==="unavailable"){dirty=true;setTimeout(flush,1500+Math.random()*1000)}
    else if(e&&e.code==="quota_exceeded"){setSync("local","Bộ nhớ đầy – chỉ lưu trên máy này")}
    else{setSync("local","Không lưu được lên mây – đang lưu trên máy này");docRef=null}
  }
  saving=false; if(dirty)flush();
}
async function initDb(){
  const local=localLoad(); if(local)state=normalize(local);
  render();
  if(!window.claude||!window.claude.use){setSync("local","Lưu trên máy này");return}
  let timer=setTimeout(()=>setSync("local","Chưa kết nối được – đang lưu trên máy này"),10000);
  try{
    db=await window.claude.use("db"); const user=await window.claude.use("user");
    const uid=user?await user.id():null;
    if(!db||!uid){clearTimeout(timer);setSync("local","Lưu trên máy này (đăng nhập để đồng bộ)");db=null;return}
    docRef=db.doc("data/users/"+uid+"/progress");
    docRef.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer)}
      if(snap.metadata.hasPendingWrites)return;
      if(snap.exists){
        if(Date.now()-lastLocalEdit<3000||dirty||saving)return;
        state=normalize(JSON.parse(JSON.stringify(snap.data())));localSave();render();
        setSync("ok","Đã đồng bộ");
      }else if(!snap.metadata.fromCache){
        dirty=true;flush(); // first visit: push local copy
        setSync("ok","Đã đồng bộ");
      }
    },err=>{clearTimeout(timer);setSync("local","Mất kết nối – đang lưu trên máy này");docRef=null});
  }catch(e){clearTimeout(timer);setSync("local","Lưu trên máy này")}
}

/* ---------- calc ---------- */
function pctOf(rows){if(!rows.length)return 0;return rows.filter(r=>state.done[tid(r)]).length/rows.length}
function minsOf(rows,onlyDone){return rows.reduce((a,r)=>a+((!onlyDone||state.done[tid(r)])?r.m:0),0)}
function weekOf(iso){let w=WEEKS[0];for(const x of WEEKS)if(iso>=x.start)w=x;return w}
function streak(){
  let d=todayISO(),n=0;
  const days=[...new Set(PLAN.map(r=>r.d))];
  if(!PLAN.some(r=>r.d===d&&state.done[tid(r)]))d=addDays(d,-1);
  while(days.includes(d)||d>=PLAN[0].d){
    const rows=PLAN.filter(r=>r.d===d);
    if(!rows.length){d=addDays(d,-1);if(d<PLAN[0].d)break;continue}
    if(rows.some(r=>state.done[tid(r)])){n++;d=addDays(d,-1)}else break;
    if(d<PLAN[0].d)break;
  }
  return n;
}
function latestMock(){
  let last=null;
  for(const m of MOCKS){const v=state.mocks[m.id];if(v&&v.o!==undefined&&v.o!==""&&v.o!==null)last={...m,o:Number(v.o)}}
  return last;
}

}

function vPlan(){
  const t=todayISO();let out="",lastPhase="";
  for(const w of WEEKS){
    const rows=PLAN.filter(r=>r.w===w.id);const p=pctOf(rows);
    if(w.phase!==lastPhase){out+=`<div class="phase">${esc(w.phase)}</div>`;lastPhase=w.phase}
    const days=[...new Set(rows.map(r=>r.d))];
    const open=(t>=w.start&&t<=w.end)||(t<WEEKS[0].start&&w.id==="T0");
    out+=`<details class="card week" ${open?"open":""}><summary><span class="wk">${esc(w.id)}</span><div class="wmid"><b>${esc(w.range)}</b>${w.mock?' · <span class="muted">'+esc(w.mock)+'</span>':""}<div>${esc(w.focus)}</div><div class="bar" style="margin-top:6px"><i style="width:${p*100}%"></i></div></div><span class="wpct mono">${Math.round(p*100)}%</span></summary>

function chartSVG(){
  const pts=[{date:BASELINE.date,o:null,lbl:"28/9"}];
  const data=MOCKS.map(m=>({m,v:state.mocks[m.id]})).filter(x=>x.v&&x.v.o!==""&&x.v.o!=null&&!isNaN(Number(x.v.o)));
  if(!data.length)return `<div class="muted" style="font-size:14px">Nhập điểm Overall sau mỗi lần thi thử để thấy đường tiến độ.</div>`;
  const W=600,H=200,pl=36,pr=14,pt=14,pb=28;
  const ys=data.map(x=>Number(x.v.o));const lo=Math.min(90,...ys)-5,hi=Math.max(130,...ys)+5;
  const X=i=>pl+(data.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(data.length-1));const Y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let g="";for(const v of [100,110,120,130]){if(v<lo||v>hi)continue;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===120?"#1e5eff":"#e2e8f0"}" stroke-dasharray="${v===120?"4 4":"0"}"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#64748b" font-family="JetBrains Mono">${v}</text>`}
  const path=data.map((x,i)=>(i?"L":"M")+X(i)+" "+Y(Number(x.v.o))).join(" ");
  const dots=data.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(Number(x.v.o))}" r="4.5" fill="#1e5eff"/><text x="${X(i)}" y="${Y(Number(x.v.o))-10}" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" font-family="JetBrains Mono">${Number(x.v.o)}</text><text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#64748b">${fmt(x.m.d)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Điểm overall các lần thi thử">${g}<path d="${path}" fill="none" stroke="#1e5eff" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;
}

   <div class="full"><label class="f">Câu sai</label><textarea id="ew" rows="2" placeholder="There is a man sit on bench."></textarea></div>
   <div class="full"><label class="f">Câu đúng</label><textarea id="er" rows="2" placeholder="There is a man sitting on a bench."></textarea></div>
   <div class="full" style="display:flex;justify-content:flex-end"><button class="btn pri" type="submit">Lưu lỗi</button></div>
  </form>
  <h2>Sổ lỗi <span class="muted mono" style="font-weight:600;font-size:14px">${state.errors.length}</span></h2>
  <div class="chips"><button class="chip ${errFilter==="all"?"on":""}" data-ef="all">Tất cả<b>${state.errors.length}</b></button>${ERRTYPES.filter(t=>counts[t]).sort((a,b)=>counts[b]-counts[a]).map(t=>`<button class="chip ${errFilter===t?"on":""}" data-ef="${esc(t)}">${esc(t)}<b>${counts[t]}</b></button>`).join("")}</div>
  <div class="card">${list.length?list.map(e=>`<div class="err"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div class="tmeta" style="margin:0"><span class="pill" style="background:var(--soft);color:var(--acc)">${esc(e.type)}</span><span class="mins">${esc(e.q)} · ${fmt(e.d)}</span></div><button class="del" data-del="${esc(e.id)}">Xoá</button></div><div class="wrong">${esc(e.w)}</div><div class="right">${esc(e.r)}</div></div>`).join(""):'<div class="empty">Chưa có lỗi nào. Mỗi lần luyện xong, ghi lại 1–3 câu sai ở đây.</div>'}</div>`;
}
function vMethods(){
  return `<h2 style="margin-top:4px">Phương pháp theo từng điểm yếu</h2>`+METHODS.map(m=>`<div class="card method"><h3>${esc(m.k)}</h3><span class="prob">${esc(m.p)}</span><div class="row"><b>Cách luyện</b><div>${esc(m.h)}</div></div><div class="row"><b>Khung / mẹo thi</b><div>${esc(m.t)}</div></div></div>`).join("");
}
const VIEWS={today:vToday,plan:vPlan,scores:vScores,errors:vErrors,methods:vMethods};
function current(){const h=location.hash.replace("#","");return VIEWS[h]?h:"today"}
function render(){
  const v=current();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  const openWeeks=[...document.querySelectorAll("details.week")].map(d=>d.open);
  const y=window.scrollY;const ae=document.activeElement;const focusKey=ae&&(ae.dataset.mock?("m"+ae.dataset.mock+ae.dataset.k):ae.dataset.wnote?("w"+ae.dataset.wnote):null);
  $("#app").innerHTML=VIEWS[v]();
  if(v==="plan"&&openWeeks.length===WEEKS.length)document.querySelectorAll("details.week").forEach((d,i)=>d.open=openWeeks[i]);
  if(focusKey){const el=focusKey[0]==="m"?document.querySelector(`[data-mock="${ae.dataset.mock}"][data-k="${ae.dataset.k}"]`):document.querySelector(`[data-wnote="${ae.dataset.wnote}"]`);if(el){el.focus();}}
  window.scrollTo(0,y);
}

/* ---------- events ---------- */
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches(".chk[data-id]")){if(t.checked)state.done[t.dataset.id]=true;else delete state.done[t.dataset.id];changed();render();if(t.checked)toast("Xong! 👍")}
  else if(t.id==="examDate"&&t.value){state.examDate=t.value;changed();render()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.mock){const m=state.mocks[t.dataset.mock]||(state.mocks[t.dataset.mock]={});const v=t.value.replace(/[^0-9]/g,"");if(v!==t.value)t.value=v;if(v==="")delete m[t.dataset.k];else m[t.dataset.k]=Number(v);changed()}
  else if(t.dataset.wnote){state.weekNotes[t.dataset.wnote]=t.value;changed()}
});
document.addEventListener("focusout",e=>{if(e.target.dataset&&e.target.dataset.mock&&current()==="scores"){setTimeout(()=>{if(!document.activeElement||!document.activeElement.dataset.mock)render()},50)}});
document.addEventListener("click",e=>{
  const n=e.target.closest("[data-nav]");if(n){const k=Number(n.dataset.nav);viewDate=k===0?todayISO():addDays(viewDate,k);render();return}
  const f=e.target.closest("[data-ef]");if(f){errFilter=f.dataset.ef;render();return}
  const d=e.target.closest("[data-del]");if(d){state.errors=state.errors.filter(x=>x.id!==d.dataset.del);changed();render();toast("Đã xoá");return}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="errForm")return;e.preventDefault();
  const w=$("#ew").value.trim(),r=$("#er").value.trim();if(!w&&!r){toast("Nhập câu sai hoặc câu đúng");return}
  state.errors.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:todayISO(),q:$("#eq").value,type:$("#et").value,w,r});
  if(state.errors.length>1500)state.errors=state.errors.slice(-1500);
  changed();render();toast("Đã lưu lỗi");
});
window.addEventListener("hashchange",()=>{window.scrollTo(0,0);render()});
initDb();
</script>
</body>
</html>
